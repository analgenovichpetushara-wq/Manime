workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
      # Encrypted variables (Codemagic → Environment variables):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      groups:
        - android_signing
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Restore release keystore
        script: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CM_BUILD_DIR/animalc-release.keystore"
            {
              echo "ANIMALC_UPLOAD_STORE_FILE=$CM_BUILD_DIR/animalc-release.keystore"
              echo "ANIMALC_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANIMALC_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANIMALC_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$CM_ENV"
            echo "Release signing enabled."
          else
            echo "No keystore configured — the debug variant will be built."
          fi
      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          if [ -n "${ANIMALC_UPLOAD_STORE_FILE:-}" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
